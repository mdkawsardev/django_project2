{% extends "base.html" %}
{% block title %}Home{% endblock title %}
{% block body %}
<div class="container">
    <h1>This is home page</h1>
    <table class="table table-striped mt-5">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
        </tr>
        {% for record in records %}
        <tr>
            <td>{{record.name}}</td>
            <td>{{record.email}}</td>
            <td>{{record.phone}}</td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock body %}
